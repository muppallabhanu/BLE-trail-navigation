name: Inspect and Build iOS Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List repository
        run: ls -la

      - name: Find Xcode projects
        run: find . -name "*.xcodeproj"

      - name: List build targets and schemes
        run: xcodebuild -list -project BLEBikeNavi.xcodeproj